[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-install"
version = "0.1.2"
description = "Install non-Python binaries and shared libraries into Microsoft Fabric notebooks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["zstandard; python_version < '3.14'"]

[tool.setuptools]
py-modules = ["fabric_install"]